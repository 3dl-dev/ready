name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/board/package-lock.json

      - name: Install board dependencies
        working-directory: web/board
        run: npm ci

      - name: Build board
        working-directory: web/board
        run: npm run build
        env:
          VITE_BUILD_STAMP: ${{ github.sha }}

      - name: Assemble Pages artifact
        # site/ is the existing ready.3dl.dev root (untouched). web/board's
        # build output is layered in at /board/ so the root site keeps
        # serving exactly as before and /board becomes newly available.
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/board
          cp -r web/board/dist/. _site/board/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
