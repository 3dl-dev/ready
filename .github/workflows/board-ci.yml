name: Board CI

# ready-2f1 rework: before this workflow, web/board's TypeScript build was
# only exercised by .github/workflows/pages.yml, which triggers on push to
# main and, in the SAME job, assembles and deploys the existing
# ready.3dl.dev root site. A TypeScript error in web/board would therefore
# first surface on main, inside the deploy job — taking the entire root
# site's deploy down with it, a failure mode that did not exist before
# web/board was added.
#
# This workflow runs the same npm ci / typecheck / test / build steps on
# every PR that touches web/board, so a broken board build is caught before merge —
# never on main, never coupled to the root site's deploy. (Chosen over
# splitting pages.yml's single job in two: a `needs:` split would still
# leave the root site's push-triggered deploy blocked whenever the board job
# it depends on fails, which doesn't remove the coupling — it just moves
# where the deploy stalls. Gating on the PR removes the failure mode
# entirely: broken board code never reaches main.)
# ready-e0e / ready-816: the path filter below MUST include everything the
# board's conformance vectors depend on, not just web/board itself. The board
# has a SECOND fold implementation, and testdata/fold.vectors.json is the
# shared corpus both it and internal/foldvectors replay — that corpus is what
# keeps the two folds in lockstep.
#
# When the filter was 'web/board/**' only, a Go-side change that widened
# views.GatesFilter and regenerated the shared corpus (e9e8647) triggered no
# board run, so gate_fields_persist_under_blocking was RED on main for SEVEN
# merges before anything ran it — the vector did its job and nothing executed
# it. Regenerating the corpus from the Go side must run the TS side that
# replays it, or the divergence the vectors exist to catch merges green.
on:
  pull_request:
    paths:
      - 'web/board/**'
      - 'web/.nvmrc'
      - '.github/workflows/board-ci.yml'
      - 'testdata/fold.vectors.json'
      - 'testdata/write.vectors.json'
      - 'internal/foldvectors/**'
      - 'pkg/sync/**'
      - 'pkg/views/**'
      - 'pkg/state/**'
      - 'docs/design/board-fold-spec.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/board/package-lock.json

      - name: Install board dependencies
        working-directory: web/board
        run: npm ci

      - name: Typecheck board
        working-directory: web/board
        run: npm run typecheck

      - name: Test board
        # Unit tests are fully hermetic (mocked WebSocket/fetch, no live
        # relay) — see relay.test.ts's header. The real-browser / real-relay
        # proof (ready-dbf done condition 0) is a separate manual
        # verification, never a CI test (rule 11: a live-network test inside
        # a hermetic suite is a flakiness hazard).
        working-directory: web/board
        run: npm run test

      - name: Build board
        working-directory: web/board
        run: npm run build
